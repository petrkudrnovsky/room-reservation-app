api_login_check:
    path: /api/login_check
controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
api:
    resource: ../src/Api/Controller/
    prefix: /api
    type: attribute
fallback:
    path: /{route}
    requirements:
        route: .+
    defaults:
        _controller: App\Controller\AppUserController::fallback
app.swagger_ui:
    path: /api/doc
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui }